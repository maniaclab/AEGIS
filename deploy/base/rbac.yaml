# RBAC for AFchatkit and all MCP servers.
#
# Each workload gets its own ServiceAccount (with token auto-mount disabled —
# none of these services call the Kubernetes API directly) and a least-privilege
# Role that grants `get` only on the Secrets / ConfigMaps that workload
# actually consumes.
#
# Pattern
#   ServiceAccount  →  <workload-name>
#   Role            →  <workload-name>-role
#   RoleBinding     →  <workload-name>-rolebinding

# ──────────────────────────────────────────────────────────────
# AFchatkit
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: afchatkit
  namespace: aegis
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: afchatkit-role
  namespace: aegis
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openai-key", "chatkit-workflow-id", "mcp"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["keycloak-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: afchatkit-rolebinding
  namespace: aegis
subjects:
  - kind: ServiceAccount
    name: afchatkit
    namespace: aegis
roleRef:
  kind: Role
  name: afchatkit-role
  apiGroup: rbac.authorization.k8s.io

