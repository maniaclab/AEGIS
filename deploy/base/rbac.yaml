# ──────────────────────────────────────────────────────────────
# OWL – worker (ingest, sweeps, notifications)
#
# No mcp-keys: the worker serves no requests. It does get owl-mattermost, which the
# front end must not have — nothing that answers HTTP should be able to post to the
# collaboration's channel.
# ──────────────────────────────────────────────────────────────
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: owl-worker
  namespace: aegis
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: owl-worker-role
  namespace: aegis
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["owl-db", "owl-s3", "openai-key", "owl-mattermost"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["owl-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: owl-worker-rolebinding
  namespace: aegis
subjects:
  - kind: ServiceAccount
    name: owl-worker
    namespace: aegis
roleRef:
  kind: Role
  name: owl-worker-role
  apiGroup: rbac.authorization.k8s.io
