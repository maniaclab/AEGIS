# spark-relay — lets aegis pods reach the vLLMs on the DGX Sparks over the tailnet.
#
# The campus network drops traffic from the AF cluster (192.170.240.0/23) to the
# Sparks, but both sides are on Tailscale. This pod joins the tailnet and forwards
#   spark-relay:8000  →  spark1  (100.111.147.45):8000   nano-30b (Nemotron 3 Nano)
#   spark-relay:8001  →  spark-2 (100.86.2.51):8000      qwen3.6-35b — OWL's cheap model
#
#   tailscale  — userspace networking (no NET_ADMIN, no /dev/net/tun), exposes a
#                SOCKS5 proxy on localhost:1055. Node state lives in the Secret
#                spark-relay-tsstate, so the relay keeps its identity across restarts and
#                the auth key is only used for the first login (TS_AUTH_ONCE).
#   socat-*    — one plain TCP listener per target, dialling through that SOCKS5 proxy.
#
# The target is the tailnet IP rather than the MagicDNS name: cluster DNS cannot
# resolve *.ts.net. Get it with `tailscale ip -4 spark1` (or spark-2) if a node is re-added.
#
# Tailnet ACL: the auth key carries tag:af-k8s, and the policy should allow only
#   { "action": "accept", "src": ["tag:af-k8s"], "dst": ["spark1:8000", "spark-2:8000"] }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark-relay
  namespace: aegis
# Unlike the MCP servers, tailscale talks to the Kubernetes API to keep its state Secret.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-relay-role
  namespace: aegis
rules:
  # `create` cannot be limited by resourceNames; tailscale creates the state Secret on
  # first start.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["spark-relay-tsstate"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-relay-rolebinding
  namespace: aegis
subjects:
  - kind: ServiceAccount
    name: spark-relay
    namespace: aegis
roleRef:
  kind: Role
  name: spark-relay-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: spark-relay
  namespace: aegis
spec:
  selector:
    app: spark-relay
  ports:
    - name: vllm-spark1
      port: 8000
      targetPort: 8000
    - name: vllm-spark2
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-relay
  namespace: aegis
spec:
  replicas: 1
  strategy:
    # One tailnet node identity; two pods sharing the state Secret would fight over it.
    type: Recreate
  selector:
    matchLabels:
      app: spark-relay
  template:
    metadata:
      labels:
        app: spark-relay
    spec:
      serviceAccountName: spark-relay
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.102.5
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: spark-relay-authkey
                  key: TS_AUTHKEY
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_KUBE_SECRET
              value: spark-relay-tsstate
            - name: TS_USERSPACE
              value: "true"
            - name: TS_SOCKS5_SERVER
              value: "127.0.0.1:1055"
            - name: TS_HOSTNAME
              value: af-spark-relay
            - name: TS_ACCEPT_DNS
              value: "false"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
        - name: socat
          image: alpine/socat:1.8.1.3
          args:
            - "TCP-LISTEN:8000,fork,reuseaddr"
            - "SOCKS5-CONNECT:127.0.0.1:1055:100.111.147.45:8000"
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "500m"
        - name: socat-spark2
          image: alpine/socat:1.8.1.3
          args:
            - "TCP-LISTEN:8001,fork,reuseaddr"
            - "SOCKS5-CONNECT:127.0.0.1:1055:100.86.2.51:8000"
          ports:
            - containerPort: 8001
          readinessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "500m"
---
# Only OWL may use the relay. Everything else on the tailnet stays out of reach anyway
# (socat has one fixed target), but the GPU should not become a free-for-all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spark-relay-owl-only
  namespace: aegis
spec:
  podSelector:
    matchLabels:
      app: spark-relay
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["owl-worker", "mcp-server-owl"]
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8001
