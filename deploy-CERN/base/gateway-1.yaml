apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-gw
spec:
  gatewayClassName: cilium
  listeners:
    # No hostname: one plain-HTTP listener serves cert-manager's HTTP01
    # challenges for every hostname below.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-cric
      hostname: aegis-cric.cern.ch
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: aegis-cric-tls
