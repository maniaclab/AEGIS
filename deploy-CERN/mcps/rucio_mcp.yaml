kind: Service
apiVersion: v1
metadata:
  name: mcp-server-rucio
  namespace: aegis
spec:
  selector:
    app: mcp-server-rucio
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rucio-mcp
  namespace: aegis
  labels:
    k8s-app: rucio-mcp
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - rucio.af.atlas-ml.org
      secretName: letsencrypt-generated-rucio-mcp
  rules:
    - host: rucio.af.atlas-ml.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server-rucio
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-rucio
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-rucio
  template:
    metadata:
      labels:
        app: mcp-server-rucio
        role: mcp-server
    spec:
      serviceAccountName: mcp-server-rucio
      automountServiceAccountToken: false
      volumes:
        - name: rucio-cfg
          configMap:
            name: rucio-config
            defaultMode: 420
        - name: x509-secret
          secret:
            secretName: x509-proxy
            defaultMode: 292
      containers:
        - name: mcp-server-rucio
          # image: hub.opensciencegrid.org/maniaclab/mcp-server-rucio
          image: harbor.af.uchicago.edu/maniaclab/mcp-server-rucio
          # image: ivukotic/mcp-server-rucio
          # command: ["sh", "-c", "echo Hello Rucio! && sleep 3600"]
          # Listens on 127.0.0.1:8001 only; reached through the rucio-auth-proxy container below.
          env:
            - name: RUCIO_CONFIG
              value: /opt/rucio/etc/rucio.cfg
          envFrom:
            - secretRef:
                name: rucio-mcp-token
          volumeMounts:
            - name: rucio-cfg
              mountPath: /opt/rucio/etc/
            - name: x509-secret
              readOnly: true
              mountPath: /etc/grid-security-ro
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        # Checks Keycloak tokens / AF API keys like the other MCPs and forwards to rucio-mcp
        # with its shared secret, so Rucio gets the same OAuth login as everything else.
        - name: rucio-auth-proxy
          image: harbor.af.uchicago.edu/maniaclab/mcp-server-rucio-proxy
          ports:
            - containerPort: 8000
          env:
            - name: UPSTREAM_URL
              value: http://127.0.0.1:8001/site/atlas/
            - name: KEYCLOAK_AUDIENCE
              value: rucio-mcp
            - name: MCP_RESOURCE_URL
              value: https://rucio.af.atlas-ml.org/mcp
          envFrom:
            - secretRef:
                name: mcp-keys
            - secretRef:
                name: rucio-mcp-token
            - configMapRef:
                name: keycloak-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
