apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-ingress-only
  namespace: aegis
spec:
  # Targets every MCP server pod (all carry role: mcp-server)
  podSelector:
    matchLabels:
      role: mcp-server
  policyTypes:
    - Ingress
  ingress:
    # Allow the nginx ingress controller to reach MCP pods.
    # namespaceSelector + podSelector in the same `from` entry are ANDed:
    # traffic must originate from a pod matching BOTH selectors.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
    # Allow pods within aegis itself (e.g. chatbots calling MCPs
    # internally).  Remove this rule if intra-namespace access should also
    # be locked down.
    - from:
        - podSelector: {}
---
# Traffic from the cilium Gateway carries Cilium's reserved "ingress" identity,
# which the plain NetworkPolicy above cannot select. Policies are additive, so
# this only opens the MCP pods to the Gateway's Envoy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mcp-servers-from-gateway
  namespace: aegis
spec:
  endpointSelector:
    matchLabels:
      role: mcp-server
  ingress:
    - fromEntities:
        - ingress
