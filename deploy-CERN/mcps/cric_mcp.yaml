kind: Service
apiVersion: v1
metadata:
  name: mcp-server-cric
  namespace: aegis
spec:
  selector:
    app: mcp-server-cric
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# Exposes the server at https://aegis-cric.cern.ch/mcp through the cilium Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cric-mcp
  namespace: aegis
spec:
  parentRefs:
    - name: cilium
      sectionName: https-cric
  hostnames:
    - aegis-cric.cern.ch
  rules:
    - backendRefs:
        - name: mcp-server-cric
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-cric
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-cric
  template:
    metadata:
      labels:
        app: mcp-server-cric
        role: mcp-server
    spec:
      serviceAccountName: mcp-server-cric
      automountServiceAccountToken: false
      volumes:
        - name: x509-secret
          secret:
            secretName: x509-proxy
            defaultMode: 292
      containers:
        - name: mcp-server-cric
          # image: hub.opensciencegrid.org/maniaclab/mcp-server-cric
          # image: harbor.af.uchicago.edu/maniaclab/mcp-server-cric
          image: ivukotic/mcp-server-cric
          # command: ["sh", "-c", "echo Hello cric! && sleep 3600"]
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: mcp-keys
            - configMapRef:
                name: keycloak-config
          env:
            # Overrides the shared audience so tokens minted for other MCPs are rejected here.
            - name: KEYCLOAK_AUDIENCE
              value: cric-mcp
            - name: MCP_RESOURCE_URL
              value: https://aegis-cric.cern.ch/mcp
          volumeMounts:
            - name: x509-secret
              readOnly: true
              mountPath: /etc/grid-security-ro
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
