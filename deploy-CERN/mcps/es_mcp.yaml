kind: Service
apiVersion: v1
metadata:
  name: mcp-server-elasticsearch
  namespace: aegis
spec:
  selector:
    app: mcp-server-elasticsearch
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
---
# Exposes the server at https://aegis-es.cern.ch/mcp through the cilium Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: es-mcp
  namespace: aegis
spec:
  parentRefs:
    - name: cilium
      sectionName: https-es
  hostnames:
    - aegis-es.cern.ch
  rules:
    - backendRefs:
        - name: mcp-server-elasticsearch
          port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-elasticsearch
  namespace: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server-elasticsearch
  template:
    metadata:
      labels:
        app: mcp-server-elasticsearch
        role: mcp-server
    spec:
      serviceAccountName: mcp-server-elasticsearch
      automountServiceAccountToken: false
      containers:
        - name: mcp-server-elasticsearch
          # image: hub.opensciencegrid.org/maniaclab/mcp-server-elasticsearch
          # image: harbor.af.uchicago.edu/maniaclab/mcp-server-elasticsearch
          image: ivukotic/mcp-server-elasticsearch
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: es-secret
            - secretRef:
                name: mcp-keys
            - configMapRef:
                name: keycloak-config
          env:
            # Overrides the shared audience so tokens minted for other MCPs are rejected here.
            - name: KEYCLOAK_AUDIENCE
              value: es-mcp
            - name: MCP_RESOURCE_URL
              value: https://aegis-es.cern.ch/mcp
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
